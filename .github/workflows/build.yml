# CI build — builds ONLY the AniKoto S debug APK on this feature branch.
# (The main branch's build.yml builds all extensions; this branch only needs the one
# we're actively working on, for faster feedback while testing.)
name: Build AniKoto S (CI)

on:
  push:
    branches: [anikoto-s]
  workflow_dispatch:

jobs:
  build:
    name: Build AniKoto S debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          # ubuntu-latest has Android SDK pre-installed at ANDROID_HOME.
          # Accept licenses non-interactively + ensure the needed packages.
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x EXTENSIONS/anikotos/DEV/gradlew

      # Debug build needs no keystore.
      - name: Build AniKoto S (debug)
        working-directory: EXTENSIONS/anikotos/DEV
        run: ./gradlew :src:en:anikotos:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find EXTENSIONS/anikotos -path "*/build/outputs/apk/**/*.apk" -exec cp {} artifacts/ \;
          echo "=== APK artifact ==="
          ls -la artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anikotos-debug-apk
          path: artifacts/*.apk
          retention-days: 14
          if-no-files-found: error
