# CI build — builds debug APKs for all extensions on every push/PR to main.
# This is a sanity check: if any extension stops compiling, this catches it.
# Release (signed) builds are handled by release.yml (triggered by tags).
name: Build (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          # ubuntu-latest has Android SDK pre-installed at ANDROID_HOME.
          # Accept licenses non-interactively + ensure the needed packages.
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x EXTENSIONS/*/DEV/gradlew

      # Debug builds need no keystore. Each extension is an independent Gradle project.
      - name: Build AniKoto (debug)
        working-directory: EXTENSIONS/anikoto/DEV
        run: ./gradlew :src:en:anikoto:assembleDebug --no-daemon --stacktrace

      - name: Build AnimePahe (debug)
        working-directory: EXTENSIONS/animepahe/DEV
        run: ./gradlew :src:en:animepahe:assembleDebug --no-daemon --stacktrace

      - name: Build MKissa (debug)
        working-directory: EXTENSIONS/mkissa/DEV
        run: ./gradlew :src:en:mkissa:assembleDebug --no-daemon --stacktrace

      - name: Build AniDB (debug)
        working-directory: EXTENSIONS/anidb/DEV
        run: ./gradlew :src:en:anidb:assembleDebug --no-daemon --stacktrace

      - name: Build Re:ANIME (debug)
        working-directory: EXTENSIONS/reanime/DEV
        run: ./gradlew :src:en:reanime:assembleDebug --no-daemon --stacktrace

      - name: Build Miruro (debug)
        working-directory: EXTENSIONS/miruro/DEV
        run: ./gradlew :src:en:miruro:assembleDebug --no-daemon --stacktrace

      - name: Build UniQuestream (debug)
        working-directory: EXTENSIONS/uniquestream/DEV
        run: ./gradlew :src:en:uniquestream:assembleDebug --no-daemon --stacktrace

      - name: Verify UniQuestream APK manifest & DEX
        run: |
          APK=$(find EXTENSIONS/uniquestream -path "*/build/outputs/apk/debug/*.apk" | head -1)
          echo "=== APK: $APK ==="

          # 1. Verify extClass in manifest
          EXT_CLASS=$(aapt2 dump xmltree "$APK" 2>/dev/null | grep -A1 'tachiyomi.animeextension.class' | tail -1 | grep -oP '(?<=").*(?=")' || true)
          echo "extClass in manifest: '$EXT_CLASS'"
          if [ "$EXT_CLASS" != "eu.kanade.tachiyomi.animeextension.en.uniquestream.UniQuestream" ]; then
            echo "❌ FAIL: extClass mismatch! Expected 'eu.kanade.tachiyomi.animeextension.en.uniquestream.UniQuestream', got '$EXT_CLASS'"
            exit 1
          fi
          echo "✅ extClass matches"

          # 2. Verify extension class exists in DEX
          CLASS_REFS=$(unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -c 'eu/kanade/tachiyomi/animeextension/en/uniquestream/UniQuestream' || echo 0)
          echo "UniQuestream class refs in DEX: $CLASS_REFS"
          if [ "$CLASS_REFS" -eq 0 ]; then
            echo "❌ FAIL: Extension class not found in DEX!"
            exit 1
          fi
          echo "✅ Extension class found in DEX"

          # 3. Verify no stubs leaked into APK
          STUB_COUNT=$(unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -c 'Stub!' || echo 0)
          echo "Stub! strings in DEX: $STUB_COUNT"
          if [ "$STUB_COUNT" -gt 0 ]; then
            echo "❌ FAIL: Stubs leaked into APK ($STUB_COUNT occurrences)!"
            exit 1
          fi
          echo "✅ No stubs in APK"

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find EXTENSIONS -path "*/build/outputs/apk/**/*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: artifacts/*.apk
          retention-days: 14
          if-no-files-found: error
